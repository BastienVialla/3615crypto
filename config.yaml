algorithms:
  AES:
    - description: "Algorithme cryptographique symétrique. Utilisé pour le chiffrement de fichiers, WiFi, VPN, HTTPS, Signal, etc."
    - show: true
  RSA:
    - description: "Algorithme cryptographique asymétrique reposant sur la factorisation d'entiers. Utilisé pour HTTPS, signatures de documents, chiffrement de mails, carte à puces, PKI, etc"
    - show: true
  ECC:
    - description: "Algorithme cryptographique asymétrique sur courbes elliptiques. Utilisé pour HTTPS, signatures de documents, chiffrement de mails, carte à puces, blockchain, etc"
    - show: true
  Kyber: 
    - description: "Algorithme cryptographique post-quantique standard pour la cryptographie hybride. HTTPS expériemental (TLS 1.3), Apple iMessage, Signal."
    - show: true

AES:
  - title: "Choisissez la taille de la clé AES."
  - print_options:
    - option: 'Binaire (base 2)'
      show: True
    - option: 'Nombre (base 10)'
      show: True
    - option: 'Hexadécimal (base 16)'
      show: True
    - option: 'Base 64'
      show: True
  - option: '128 bits'
    description: "Offre un niveau de sécurité de 128 bits."
    show: true
  - option: '192 bits'
    description: "Offre un niveau de sécurité de 192 bits."
    show: true
  - option: '256 bits'
    description: "Offre un niveau de sécurité de 256 bits."
    show: true
RSA:
  - title: "Choisissez la taille de la clé RSA."
  - print_options:
    - option: 'Binaire (base 2)'
      show: True
    - option: 'Nombre (base 10)'
      show: True
    - option: 'Hexadécimal (base 16)'
      show: True
    - option: 'Base 64'
      show: True
  - option: "1024 bits"
    description: "Equivaut à un niveau de sécurité de 80 bits."
    show: true
  - option: "2048 bits"
    description: "Equivaut à un niveau de sécurité de 112 bits."
    show: false
  - option: "3072 bits"
    description: "Equivaut à un niveau de sécurité de 128 bits. (lent)"
    show: true
  - option: "7680 bits"
    description: "Equivaut à un niveau de sécurité de 192 bits. (très lent)"
    show: true
  - option: "15360 bits"
    description: "Equivaut à un niveau de sécurité de 256 bits. (extrèmement lent)"
    show: true
ECC:
  - title: "Choisissez une courbe elliptique."
  - print_options:
    - option: 'Binaire (base 2)'
      show: True
    - option: 'Nombre (base 10)'
      show: True
    - option: 'Hexadécimal (base 16)'
      show: True
    - option: 'Base 64'
      show: True
  - option: "SECP 256 R1"
    description: "Equivaut à un niveau de sécurité de 128 bits."
    show: true
  - option: "SECP 384 R1"
    description: "Equivaut à un niveau de sécurité de 192 bits."
    show: true
  - option: "SECP 512 R1"
    description: "Equivaut à un niveau de sécurité de 256 bits."
    show: true
Kyber:
  - title: "Choisissez la taille de la clé Kyber."
  - print_options:
    - option: 'Binaire (base 2)'
      show: True
    - option: 'Nombre (base 10)'
      show: True
    - option: 'Hexadécimal (base 16)'
      show: True
    - option: 'Base 64'
      show: True
  - option: 'ML-KEM-512'
    description: "Combine AES 128 bits + Kyber pour offrir un niveau de sécurité de 128 bits."
    show: true
  - option: 'ML-KEM-768'
    description: "Combine AES 192 bits + Kyber pour offrir un niveau de sécurité de 192 bits."
    show: true
  - option: 'ML-KEM-1024'
    description: "Combine AES 256 bits + Kyber pour offrir un niveau de sécurité de 256 bits."
    show: true